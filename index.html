<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Wall Art AR Preview</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
    font-family: system-ui, sans-serif; background:#111; color:#eee; }
  #overlay {
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    background:rgba(10,10,14,0.85); backdrop-filter: blur(6px);
  }
  #overlay label { display:block; font-size:12px; color:#aaa; margin-bottom:4px; }
  #overlay .row { display:flex; gap:10px; margin-bottom:10px; align-items:center; }
  #overlay input[type=number] { width:64px; padding:6px; border-radius:4px; border:1px solid #444; background:#1a1a1e; color:#eee; }
  #overlay input[type=file] { color:#ccc; font-size:12px; }
  #overlay .btn {
    padding:8px 14px; border-radius:6px; border:1px solid #555; background:#26262c; color:#eee;
    font-size:13px;
  }
  #instructions {
    position:fixed; top:0; left:0; right:0; z-index:10; padding:14px 16px;
    background:linear-gradient(180deg, rgba(0,0,0,0.75), rgba(0,0,0,0));
    font-size:13px; color:#ddd; pointer-events:none;
  }
  #arNotice { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:30px; font-size:15px; color:#ccc; z-index:5; }
</style>
</head>
<body>

<div id="instructions">Move your phone slowly to scan the wall. A white ring means a surface is found — tap it to hang your picture.</div>

<div id="arNotice">Loading AR…</div>

<div id="overlay">
  <div class="row">
    <div>
      <label>Upload artwork photo</label>
      <input type="file" id="imgInput" accept="image/*">
    </div>
  </div>
  <div class="row">
    <div>
      <label>Width (cm)</label>
      <input type="number" id="wCm" value="40" min="5" max="300">
    </div>
    <div>
      <label>Height (cm)</label>
      <input type="number" id="hCm" value="50" min="5" max="300">
    </div>
    <button class="btn" id="clearBtn">Clear placed</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

let camera, scene, renderer, controller, reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;
let currentTexture = null;
const placed = [];

init();

function init(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);

  const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  light.position.set(0.5, 1, 0.25);
  scene.add(light);

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  const arBtn = document.createElement('button');
  arBtn.textContent = 'START AR';
  arBtn.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:30; padding:12px 24px; border:1px solid #fff; background:transparent; color:#fff; font-size:14px;';
  document.body.appendChild(arBtn);
  document.getElementById('arNotice').remove();

  arBtn.addEventListener('click', async () => {
    try {
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.body }
      });
      renderer.xr.setSession(session);
      arBtn.style.display = 'none';
    } catch (err) {
      alert('AR failed to start: ' + err.message);
    }
  });

  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.09, 0.11, 32).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  window.addEventListener('resize', onWindowResize);

  document.getElementById('imgInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      new THREE.TextureLoader().load(evt.target.result, (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        currentTexture = tex;
      });
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    placed.forEach(m => scene.remove(m));
    placed.length = 0;
  });

  renderer.setAnimationLoop(render);
}

function onWindowResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function onSelect(){
  if (!reticle.visible) return;
  const wCm = parseFloat(document.getElementById('wCm').value) || 40;
  const hCm = parseFloat(document.getElementById('hCm').value) || 50;
  const w = wCm / 100, h = hCm / 100;

  const group = new THREE.Group();

  const frameGeo = new THREE.PlaneGeometry(w + 0.04, h + 0.04);
  const frameMat = new THREE.MeshBasicMaterial({ color: 0xf5f5f0, side: THREE.DoubleSide });
  const frameMesh = new THREE.Mesh(frameGeo, frameMat);
  frameMesh.position.z = -0.002;
  group.add(frameMesh);

  const geo = new THREE.PlaneGeometry(w, h);
  const mat = currentTexture
    ? new THREE.MeshBasicMaterial({ map: currentTexture, side: THREE.DoubleSide })
    : new THREE.MeshBasicMaterial({ color: 0x6699cc, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  group.add(mesh);

  reticle.matrix.decompose(group.position, group.quaternion, group.scale);
  scene.add(group);
  placed.push(group);
}

function render(timestamp, frame){
  if (frame){
    const referenceSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();

    if (!hitTestSourceRequested){
      session.requestReferenceSpace('viewer').then((refSpace) => {
        session.requestHitTestSource({ space: refSpace }).then((source) => {
          hitTestSource = source;
        });
      });
      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
      });
      hitTestSourceRequested = true;
    }

    if (hitTestSource){
      const results = frame.getHitTestResults(hitTestSource);
      if (results.length > 0){
        const hit = results[0];
        reticle.visible = true;
        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
      } else {
        reticle.visible = false;
      }
    }
  }
  renderer.render(scene, camera);
}
</script>

</body>
</html>
